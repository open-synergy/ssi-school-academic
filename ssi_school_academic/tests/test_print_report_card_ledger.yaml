scenarios:
  - name: "Ledger - Rows, cells, totals and rank by total"
    steps:
      - step: "Create the report card of student 1"
        action: "create"
        model: "school_report_card"
        save_as: "card_1"
        values:
          enrollment_id: "REC: enrollment_1.id"
          type_id: "REC: card_type.id"
          print_date: 2026-12-20
          print_city: "Jakarta"
          user_id: "REF: base.user_admin"
          line_ids:
            - - 0
              - 0
              - subject_id: "REC: subject_m.id"
                final_score: 80.0
                is_scored: true
            - - 0
              - 0
              - subject_id: "REC: subject_x.id"
                final_score: 90.0
                is_scored: true
            - - 0
              - 0
              - subject_id: "REC: subject_y.id"
                final_score: 70.0
                is_scored: true
            - - 0
              - 0
              - subject_id: "REC: subject_z.id"
                final_score: 60.0
                is_scored: true

      - step: "Confirm the report card of student 1"
        action: "call"
        target: "card_1"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the report card of student 1, which finishes it"
        action: "call"
        target: "card_1"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

