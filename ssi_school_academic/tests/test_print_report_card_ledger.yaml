# T-01 (odoo-development-unit-test/test-traps.md): the `setup:` block replays
# before every scenario inside one un-rolled-back transaction, so every
# unique-constrained code it creates is generated per replay from a count of
# the existing records. Every replay builds its own grade, class and students,
# so a scenario only reads the rows of its own wizard record, which are found
# by the wizard and the enrollment, never by a count of the whole table.
options:
  auto_refresh: true

setup:
  steps:
    - step: "Create the grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "LDG Grade Type"
        code: "EVAL: 'LDGGT%d' % env['school_grade_type'].search_count([])"

    - step: "Create the school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "LDG School"
        code: "EVAL: 'LDGSC%d' % env['school'].search_count([])"
        grade_type_id: "REC: grade_type.id"

    - step: "Create the academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "LDG Academic Year"
        code: "EVAL: 'LDGAY%d' % env['school_academic_year'].search_count([])"
        date_start: 2026-07-01
        date_end: 2027-06-30

    - step: "Create the academic term open for enrollment"
      action: "create"
      model: "school_academic_term"
      save_as: "academic_term"
      values:
        name: "LDG Term"
        code: "EVAL: 'LDGTM%d' % env['school_academic_term'].search_count([])"
        date_start: 2026-07-01
        date_end: 2026-12-31
        year_id: "REC: academic_year.id"
        enrollment_state: "open"

    - step: "Create the grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "LDG Grade"
        code: "EVAL: 'LDGGR%d' % env['school_grade'].search_count([])"
        type_id: "REC: grade_type.id"

    - step: "Create the grade class of the expertise program"
      action: "create"
      model: "school_grade_class"
      save_as: "grade_class"
      values:
        name: "LDG Class"
        code: "EVAL: 'LDGCL%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        expertise_program: "LDG Program"

    - step: "Create the subject M"
      action: "create"
      model: "school_subject"
      save_as: "subject_m"
      values:
        name: "LDG Subject M"
        code: "EVAL: 'LDGSM%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"
        minimum_score_ids:
          - - 0
            - 0
            - grade_id: "REC: grade.id"
