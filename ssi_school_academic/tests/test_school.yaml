# T-01 (odoo-development-unit-test/test-traps.md): `setup:` replays before
# every scenario without rollback, so the unique codes are generated per replay.
options:
  auto_refresh: true

setup:
  steps:
    - step: "Create the grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "SCH Grade Type"
        code: "EVAL: 'SCHGT%d' % env['school_grade_type'].search_count([])"

    - step: "Create the school with default teaching hour settings"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "SCH School"
        code: "EVAL: 'SCHSC%d' % env['school'].search_count([])"
        grade_type_id: "REC: grade_type.id"

scenarios:
  - name: "School - Default teaching hour settings"
    steps:
      - step: "A new school gets zero hours and the half factor"
        action: "assert"
        target: "school"
        asserts:
          teacher_mandatory_weekly_hours:
            type: "value"
            expected: 0
          co_teaching_hour_factor:
            type: "value"
            expected: 0.5

  - name: "School - Teaching hour settings can be written"
    steps:
      - step: "Write both settings"
        action: "write"
        target: "school"
        values:
          teacher_mandatory_weekly_hours: 24
          co_teaching_hour_factor: 0.25

      - step: "Both values are kept"
        action: "assert"
        target: "school"
        asserts:
          teacher_mandatory_weekly_hours:
            type: "value"
            expected: 24
          co_teaching_hour_factor:
            type: "value"
            expected: 0.25

      - step: "The boundary factors one and zero are accepted"
        action: "write"
        target: "school"
        values:
          co_teaching_hour_factor: 1.0

      - step: "The factor zero is accepted"
        action: "write"
        target: "school"
        values:
          co_teaching_hour_factor: 0.0

  - name: "School - Reject invalid teaching hour settings"
    steps:
      - step: "Reject negative mandatory weekly hours"
        action: "write"
        target: "school"
        expect_error:
          type: "ValidationError"
          message_contains: "must not be negative"
        values:
          teacher_mandatory_weekly_hours: -1

      - step: "Reject a factor above one"
        action: "write"
        target: "school"
        expect_error:
          type: "ValidationError"
          message_contains: "must be between 0 and 1"
        values:
          co_teaching_hour_factor: 1.5

      - step: "Reject a negative factor"
        action: "write"
        target: "school"
        expect_error:
          type: "ValidationError"
          message_contains: "must be between 0 and 1"
        values:
          co_teaching_hour_factor: -0.1
