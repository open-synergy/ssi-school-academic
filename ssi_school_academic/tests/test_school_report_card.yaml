  - name: "School Report Card - A score of zero counts in the average"
    steps:
      - step: "Create the type averaging the three daily tests"
        action: "create"
        model: "school_report_card_type"
        save_as: "avg_type"
        values:
          name: "SRC Average Only"
          code: "EVAL: 'SRCAV%d' % env['school_report_card_type'].search_count([])"
          term_type: "final"
          average_weight: 100.0
          average_component_ids:
            - - 6
              - 0
