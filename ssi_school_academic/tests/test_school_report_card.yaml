            expected: "done"

      - step: "Compute the scores"
        action: "call"
        target: "card"
        method: "action_compute_scores"
        as_user: "base.user_admin"
        refresh: true

      - step: "Refresh the line"
        action: "search"
        model: "school_report_card_line"
        domain:
          - ["report_card_id", "=", "REC: card.id"]
          - ["subject_id", "=", "REC: subject.id"]
        save_as: "line_after"
        expect_count: 1

      - step: "Assert the final score of the line"
        action: "assert"
        target: "line_after"
        asserts:
          final_score:
            type: "value"
            expected: 87.0
          minimum_score:
            type: "value"
            expected: 70.0
          predicate_line_id.name:
            type: "value"
            expected: "B"

