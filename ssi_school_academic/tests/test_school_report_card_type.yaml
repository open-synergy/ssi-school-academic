          category: "assignment"
          sequence: 20
      - step: "Create component PTS"
        action: "create"
        model: "school_score_component"
        save_as: "component_pts"
        values:
          name: "PTS"
          code: "RCT5C"
          category: "mid_term_exam"
          sequence: 30
      - step: "Reject a rounding threshold of 1.2"
        action: "create"
        model: "school_report_card_type"
        expect_error:
          type: "ValidationError"
          message_contains: "between 0 and 1"
        values:
          name: "Mid-Term 5"
          code: "RCTYPE5"
          term_type: "mid_term"
          average_weight: 70.0
          rounding_threshold: 1.2
          average_component_ids:
            - - 6
              - 0
              - - "REC: component_uh.id"
                - "REC: component_task.id"
          weight_ids:
            - - 0
              - 0
              - component_id: "REC: component_pts.id"
                weight: 30.0

  - name: "Reject Average Weight Without Components"
    steps:
      - step: "Create component UH 1"
        action: "create"
