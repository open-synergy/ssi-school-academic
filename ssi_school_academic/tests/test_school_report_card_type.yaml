          code: "RCT4C"
          category: "mid_term_exam"
          sequence: 30
      - step: "Reject a component averaged and weighted"
        action: "create"
        model: "school_report_card_type"
        expect_error:
          type: "ValidationError"
          message_contains: "only be weighted once"
        values:
          name: "Mid-Term 4"
          code: "RCTYPE4"
          term_type: "mid_term"
          average_weight: 70.0
          average_component_ids:
            - - 6
              - 0
              - - "REC: component_uh.id"
                - "REC: component_pts.id"
          weight_ids:
            - - 0
              - 0
              - component_id: "REC: component_pts.id"
                weight: 30.0

  - name: "Reject Rounding Threshold Out Of Range"
    steps:
      - step: "Create component UH 1"
        action: "create"
        model: "school_score_component"
        save_as: "component_uh"
        values:
          name: "UH 1"
          code: "RCT5A"
          category: "daily_test"
          sequence: 10
      - step: "Create component Tugas 1"
        action: "create"
