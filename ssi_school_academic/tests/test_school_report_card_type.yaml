options:
  auto_refresh: true
scenarios:
  - name: "Create Report Card Type"
    steps:
      - step: "Create component UH 1"
        action: "create"
        model: "school_score_component"
        save_as: "component_uh"
        values:
          name: "UH 1"
          code: "RCT1A"
          category: "daily_test"
          sequence: 10
      - step: "Create component Tugas 1"
        action: "create"
        model: "school_score_component"
        save_as: "component_task"
        values:
          name: "Tugas 1"
          code: "RCT1B"
          category: "assignment"
          sequence: 20
      - step: "Create component PTS"
        action: "create"
        model: "school_score_component"
        save_as: "component_pts"
        values:
          name: "PTS"
          code: "RCT1C"
          category: "mid_term_exam"
          sequence: 30
      - step: "Create the mid-term type with all weights in one write"
        action: "create"
        model: "school_report_card_type"
        save_as: "report_type"
        values:
          name: "Mid-Term 1"
          code: "RCTYPE1"
          term_type: "mid_term"
          average_weight: 70.0
          average_component_ids:
            - - 6
              - 0
              - - "REC: component_uh.id"
                - "REC: component_task.id"
          weight_ids:
            - - 0
              - 0
              - component_id: "REC: component_pts.id"
                weight: 30.0
          display_component_ids:
            - - 6
              - 0
              - - "REC: component_uh.id"
      - step: "Assert the report card type"
        action: "assert"
        target: "report_type"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          rounding_threshold:
            type: "value"
            expected: 0.56
          average_component_ids:
            type: "m2m"
            check: "count"
            expected_count: 2
          weight_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          display_component_ids:
            type: "m2m"
            check: "count"
            expected_count: 1

  - name: "Edit Report Card Type"
    steps:
      - step: "Create component UH 1"
        action: "create"
