          - ["type_id", "=", "REC: report_type.id"]
          - ["component_id", "=", "REC: component_pas.id"]
        save_as: "line_pas"
        limit: 1
      - step: "Swap the two weights in one write"
        action: "write"
        target: "report_type"
        values:
          weight_ids:
            - - 1
              - "REC: line_pts.id"
              - weight: 30.0
            - - 1
              - "REC: line_pas.id"
              - weight: 20.0
      - step: "Assert the new weights and the total"
        action: "assert"
        target: "report_type"
        asserts:
          total_weight:
            type: "value"
            expected: 100.0
          weight_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
      - step: "Assert the PTS weight"
        action: "assert"
        target: "line_pts"
        asserts:
          weight:
            type: "value"
            expected: 30.0
