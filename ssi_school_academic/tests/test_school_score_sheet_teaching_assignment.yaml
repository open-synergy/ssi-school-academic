options:
  auto_refresh: true

setup:
  steps:
    - step: "Create the grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "SSSTA Grade Type"
        code: "EVAL: 'SSSTAGT%d' % env['school_grade_type'].search_count([])"

    - step: "Create the school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "SSSTA School"
        code: "EVAL: 'SSSTASC%d' % env['school'].search_count([])"
        grade_type_id: "REC: grade_type.id"

    - step: "Create the academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "SSSTA Academic Year"
        code: "EVAL: 'SSSTAAY%d' % env['school_academic_year'].search_count([])"
        date_start: 2026-07-01
        date_end: 2027-06-30

    - step: "Create the first term, on progress"
      action: "create"
      model: "school_academic_term"
      save_as: "term_1"
      values:
        name: "SSSTA Term 1"
        code: "EVAL: 'SSSTATM%d' % env['school_academic_term'].search_count([])"
        date_start: 2026-07-01
        date_end: 2026-12-31
        year_id: "REC: academic_year.id"
        state: "open"

    - step: "Create the second term of the same year"
      action: "create"
      model: "school_academic_term"
      save_as: "term_2"
      values:
        name: "SSSTA Term 2"
        code: "EVAL: 'SSSTATM%d' % env['school_academic_term'].search_count([])"
        date_start: 2027-01-01
        date_end: 2027-06-30
        year_id: "REC: academic_year.id"

    - step: "Create the grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "SSSTA Grade"
        code: "EVAL: 'SSSTAGR%d' % env['school_grade'].search_count([])"
        type_id: "REC: grade_type.id"

    - step: "Create class X"
      action: "create"
      model: "school_grade_class"
      save_as: "class_x"
      values:
        name: "SSSTA Class X"
        code: "EVAL: 'SSSTACX%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create class Y"
      action: "create"
      model: "school_grade_class"
      save_as: "class_y"
      values:
        name: "SSSTA Class Y"
        code: "EVAL: 'SSSTACY%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create subject A taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_a"
      values:
        name: "SSSTA Subject A"
        code: "EVAL: 'SSSTASA%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create subject B taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_b"
      values:
        name: "SSSTA Subject B"
        code: "EVAL: 'SSSTASB%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create the homeroom of class X in term 1"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_x1"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_x.id"

    - step: "Create the homeroom of class Y in term 1"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_y1"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_y.id"

    - step: "Create the homeroom of class X in term 2"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_x2"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_2.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_x.id"

    - step: "Create the user of teacher 1"
      action: "create"
      model: "res.users"
      save_as: "user_1"
      values:
        name: "SSSTA Teacher User 1"
        login: "EVAL: 'sssta_user_1_%d' % env['res.users'].search_count([])"
        groups_id:
          [
            [
              6,
              0,
              [
                "REF: base.group_user",
                "REF: ssi_school_academic.school_score_sheet_user_group",
              ],
            ],
          ]

    - step: "Create the home address of teacher 1"
      action: "create"
      model: "res.partner"
      save_as: "partner_1"
      values:
        name: "SSSTA Teacher Home 1"

    - step: "Create the employee of teacher 1"
      action: "create"
      model: "hr.employee"
      save_as: "employee_1"
      values:
        name: "SSSTA Teacher Employee 1"
        company_id: "base.main_company"
        address_home_id: "REC: partner_1.id"
        user_id: "REC: user_1.id"

    - step: "Create teacher 1"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_1"
      values:
        name: "SSSTA Teacher 1"
        code: "EVAL: 'SSSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_1.id"

    - step: "Create the user of teacher 2"
      action: "create"
      model: "res.users"
      save_as: "user_2"
      values:
        name: "SSSTA Teacher User 2"
        login: "EVAL: 'sssta_user_2_%d' % env['res.users'].search_count([])"
        groups_id:
          [
            [
              6,
              0,
              [
                "REF: base.group_user",
                "REF: ssi_school_academic.school_score_sheet_user_group",
              ],
            ],
          ]

    - step: "Create the home address of teacher 2"
      action: "create"
      model: "res.partner"
      save_as: "partner_2"
      values:
        name: "SSSTA Teacher Home 2"

    - step: "Create the employee of teacher 2"
      action: "create"
      model: "hr.employee"
      save_as: "employee_2"
      values:
        name: "SSSTA Teacher Employee 2"
        company_id: "base.main_company"
        address_home_id: "REC: partner_2.id"
        user_id: "REC: user_2.id"

    - step: "Create teacher 2"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_2"
      values:
        name: "SSSTA Teacher 2"
        code: "EVAL: 'SSSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_2.id"

    - step: "Create the home address of teacher 3"
      action: "create"
      model: "res.partner"
      save_as: "partner_3"
      values:
        name: "SSSTA Teacher Home 3"

    - step: "Create the employee of teacher 3"
      action: "create"
      model: "hr.employee"
      save_as: "employee_3"
      values:
        name: "SSSTA Teacher Employee 3"
        company_id: "base.main_company"
        address_home_id: "REC: partner_3.id"

    - step: "Create teacher 3"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_3"
      values:
        name: "SSSTA Teacher 3"
        code: "EVAL: 'SSSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_3.id"

scenarios:
  - name: "Score Sheet - A teacher gets the teacher and the open term"
    steps:
      - step: "Create the assignment of teacher 1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSSTA header 1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Teacher 1 teaches subject A in class X"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "A new sheet of teacher 1 starts with the teacher and the open term"
        action: "form"
        model: "school_score_sheet"
        as_user: "user_1"
        save: false
        ops:
          - assert:
              teacher_id:
                type: "m2o"
                expected: "REC: teacher_1"
              academic_term_id:
                type: "m2o"
                expected:
                  "EVAL: env['school_academic_term'].search([('state', '=', 'open')],
                  limit=1)"

  - name: "Score Sheet - The only main line of a class fills the subject"
    steps:
      - step: "Create the assignment of teacher 1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSSTA header 1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Teacher 1 teaches subject A in class X"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Choosing the class fills the subject and the line"
        action: "form"
        model: "school_score_sheet"
        as_user: "user_1"
        save: false
        ops:
          - set:
              academic_term_id: "REC: term_1"
          - set:
              grade_class_id: "REC: class_x"
          - assert:
              subject_id:
                type: "m2o"
                expected: "REC: subject_a"
              teaching_assignment_line_id:
                type: "m2o"
                expected: "REC: line_1"
              allowed_grade_class_ids:
                type: "m2m"
                check: "count"
                expected_count: 1

  - name: "Score Sheet - A user without a main line is not restricted"
    steps:
      - step: "Choosing the class leaves the subject and the line empty"
        action: "form"
        model: "school_score_sheet"
        as_user: "user_2"
        save: false
        ops:
          - set:
              academic_term_id: "REC: term_1"
          - set:
              grade_class_id: "REC: class_y"
          - assert:
              teacher_id:
                type: "m2o"
                expected: "REC: teacher_2"
              subject_id:
                type: "value"
                operator: "is_falsy"
              teaching_assignment_line_id:
                type: "value"
                operator: "is_falsy"
              allowed_teaching_assignment_line_ids:
                type: "m2m"
                check: "count"
                expected_count: 0
