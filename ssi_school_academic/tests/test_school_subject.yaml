      - step: "Create subject"
        action: "create"
        model: "school_subject"
        save_as: "subject"
        values:
          name: "Mathematics"
          code: "MTKSBJ6"
          subject_group: "vocational"
          grade_ids:
            - - 6
              - 0
              - - "REC: grade_a.id"
      - step: "Reject the invalid minimum score line"
        action: "create"
        model: "school_subject_minimum_score"
        expect_error:
