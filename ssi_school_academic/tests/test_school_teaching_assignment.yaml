options:
  auto_refresh: true

setup:
  steps:
    - step: "Create the grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "SSTA Grade Type"
        code: "EVAL: 'SSTAGT%d' % env['school_grade_type'].search_count([])"

    - step: "Create the school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "SSTA School"
        code: "EVAL: 'SSTASC%d' % env['school'].search_count([])"
        grade_type_id: "REC: grade_type.id"

    - step: "Create the academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "SSTA Academic Year"
        code: "EVAL: 'SSTAAY%d' % env['school_academic_year'].search_count([])"
        date_start: 2026-07-01
        date_end: 2027-06-30

    - step: "Create the first term, on progress"
      action: "create"
      model: "school_academic_term"
      save_as: "term_1"
      values:
        name: "SSTA Term 1"
        code: "EVAL: 'SSTATM%d' % env['school_academic_term'].search_count([])"
        date_start: 2026-07-01
        date_end: 2026-12-31
        year_id: "REC: academic_year.id"
        state: "open"

    - step: "Create the second term of the same year"
      action: "create"
      model: "school_academic_term"
      save_as: "term_2"
      values:
        name: "SSTA Term 2"
        code: "EVAL: 'SSTATM%d' % env['school_academic_term'].search_count([])"
        date_start: 2027-01-01
        date_end: 2027-06-30
        year_id: "REC: academic_year.id"

    - step: "Create the grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "SSTA Grade"
        code: "EVAL: 'SSTAGR%d' % env['school_grade'].search_count([])"
        type_id: "REC: grade_type.id"

    - step: "Create class X"
      action: "create"
      model: "school_grade_class"
      save_as: "class_x"
      values:
        name: "SSTA Class X"
        code: "EVAL: 'SSTACX%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create class Y"
      action: "create"
      model: "school_grade_class"
      save_as: "class_y"
      values:
        name: "SSTA Class Y"
        code: "EVAL: 'SSTACY%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create subject A taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_a"
      values:
        name: "SSTA Subject A"
        code: "EVAL: 'SSTASA%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create subject B taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_b"
      values:
        name: "SSTA Subject B"
        code: "EVAL: 'SSTASB%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create the homeroom of class X in term 1"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_x1"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_x.id"

    - step: "Create the homeroom of class Y in term 1"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_y1"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_y.id"

    - step: "Create the homeroom of class X in term 2"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_x2"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_2.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_x.id"

    - step: "Create the user of teacher 1"
      action: "create"
      model: "res.users"
      save_as: "user_1"
      values:
        name: "SSTA Teacher User 1"
        login: "EVAL: 'ssta_user_1_%d' % env['res.users'].search_count([])"

    - step: "Create the home address of teacher 1"
      action: "create"
      model: "res.partner"
      save_as: "partner_1"
      values:
        name: "SSTA Teacher Home 1"

    - step: "Create the employee of teacher 1"
      action: "create"
      model: "hr.employee"
      save_as: "employee_1"
      values:
        name: "SSTA Teacher Employee 1"
        company_id: "base.main_company"
        address_home_id: "REC: partner_1.id"
        user_id: "REC: user_1.id"

    - step: "Create teacher 1"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_1"
      values:
        name: "SSTA Teacher 1"
        code: "EVAL: 'SSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_1.id"

    - step: "Create the user of teacher 2"
      action: "create"
      model: "res.users"
      save_as: "user_2"
      values:
        name: "SSTA Teacher User 2"
        login: "EVAL: 'ssta_user_2_%d' % env['res.users'].search_count([])"

    - step: "Create the home address of teacher 2"
      action: "create"
      model: "res.partner"
      save_as: "partner_2"
      values:
        name: "SSTA Teacher Home 2"

    - step: "Create the employee of teacher 2"
      action: "create"
      model: "hr.employee"
      save_as: "employee_2"
      values:
        name: "SSTA Teacher Employee 2"
        company_id: "base.main_company"
        address_home_id: "REC: partner_2.id"
        user_id: "REC: user_2.id"

    - step: "Create teacher 2"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_2"
      values:
        name: "SSTA Teacher 2"
        code: "EVAL: 'SSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_2.id"

    - step: "Create the home address of teacher 3"
      action: "create"
      model: "res.partner"
      save_as: "partner_3"
      values:
        name: "SSTA Teacher Home 3"

    - step: "Create the employee of teacher 3"
      action: "create"
      model: "hr.employee"
      save_as: "employee_3"
      values:
        name: "SSTA Teacher Employee 3"
        company_id: "base.main_company"
        address_home_id: "REC: partner_3.id"

    - step: "Create teacher 3"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_3"
      values:
        name: "SSTA Teacher 3"
        code: "EVAL: 'SSTATC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_3.id"

scenarios:
  - name: "Teaching Assignment - Weekly hours per role"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Create the line line_2"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_2"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2

      - step: "Create the line line_3"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_3"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_b.id"
          role: "assistant"
          weekly_hours: 3

      - step: "The hours are summed per role and in total"
        action: "assert"
        target: "header_1"
        asserts:
          main_weekly_hours:
            type: "value"
            expected: 6
          assistant_weekly_hours:
            type: "value"
            expected: 3
          total_weekly_hours:
            type: "value"
            expected: 9
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 3

  - name: "Teaching Assignment - One assignment per teacher and term"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "A second assignment of the same teacher and term is rejected"
        action: "create"
        model: "school_teaching_assignment"
        values:
          name: "SSTA duplicate"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"
        expect_error:
          type: "ValidationError"
          message_contains: "already has a teaching assignment"

      - step: "The same teacher in another term is accepted"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_term_2"
        values:
          name: "SSTA other term"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_2.id"

  - name: "Teaching Assignment - One main teacher per subject of a homeroom"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the assignment header_2"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_2"
        values:
          name: "SSTA header_2"
          code: "/"
          teacher_id: "REC: teacher_2.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Create the line line_2"
        action: "create"
        model: "school_teaching_assignment_line"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2
        expect_error:
          type: "ValidationError"
          message_contains: "already has a main teacher"

      - step: "Create the line line_3"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_3"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "assistant"
          weekly_hours: 2

      - step: "Create the line line_4"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_4"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2

  - name: "Teaching Assignment - A teacher teaches a subject of a homeroom once"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Create the line line_2"
        action: "create"
        model: "school_teaching_assignment_line"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "assistant"
          weekly_hours: 1
        expect_error:
          type: "ValidationError"
          message_contains: "already teaches this subject"

  - name: "Teaching Assignment - The subject must belong to the grade"
    steps:
      - step: "Create another grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_other"
        values:
          name: "SSTA Other Grade"
          code: "EVAL: 'SSTAGR%d' % env['school_grade'].search_count([])"
          type_id: "REC: grade_type.id"

      - step: "Create a subject taught in the other grade only"
        action: "create"
        model: "school_subject"
        save_as: "subject_other"
        values:
          name: "SSTA Other Subject"
          code: "EVAL: 'SSTASO%d' % env['school_subject'].search_count([])"
          grade_ids:
            - - 6
              - 0
              - - "REC: grade_other.id"

      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_other.id"
          role: "main"
          weekly_hours: 2
        expect_error:
          type: "ValidationError"
          message_contains: "not taught in the grade"

  - name: "Teaching Assignment - The homeroom lists the lines of every teacher"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the assignment header_2"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_2"
        values:
          name: "SSTA header_2"
          code: "/"
          teacher_id: "REC: teacher_2.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Create the line line_2"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_2"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "assistant"
          weekly_hours: 2

      - step: "Create the line line_3"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_3"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_b.id"
          role: "main"
          weekly_hours: 2

      - step: "The homeroom of class X lists the two lines"
        action: "assert"
        target: "homeroom_x1"
        asserts:
          teaching_assignment_line_ids:
            type: "o2m"
            check: "exact"
            expected_records:
              - "REC: line_1"
              - "REC: line_2"

      - step: "The teacher lists the assignment"
        action: "assert"
        target: "teacher_1"
        asserts:
          teaching_assignment_ids:
            type: "o2m"
            check: "exact"
            expected_records:
              - "REC: header_1"

  - name: "Teaching Assignment - Generate the score sheets of the main lines"
    steps:
      - step: "Create the assignment of teacher 1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header 1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the assignment of teacher 2"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_2"
        values:
          name: "SSTA header 2"
          code: "/"
          teacher_id: "REC: teacher_2.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the assignment of teacher 3, who has no user"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_3"
        values:
          name: "SSTA header 3"
          code: "/"
          teacher_id: "REC: teacher_3.id"
          academic_term_id: "REC: term_1.id"

      - step: "Main line of teacher 1 in class X"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Main line of teacher 1 in class Y, which already has a sheet"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_2"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2

      - step: "Main line of teacher 2 in class X"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_3"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_b.id"
          role: "main"
          weekly_hours: 2

      - step: "Assistant line of teacher 2, which never gets a sheet"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_4"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_b.id"
          role: "assistant"
          weekly_hours: 1

      - step: "Main line of teacher 3, who has no user"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_5"
        values:
          assignment_id: "REC: header_3.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_b.id"
          role: "main"
          weekly_hours: 2

      - step: "Create the sheet that already exists for class Y"
        action: "create"
        model: "school_score_sheet"
        save_as: "existing_sheet"
        values:
          academic_term_id: "REC: term_1.id"
          grade_class_id: "REC: class_y.id"
          subject_id: "REC: subject_a.id"
          teacher_id: "REC: teacher_1.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"

      - step: "Open the generate wizard on the three assignments"
        action: "create"
        model: "generate_score_sheet_from_teaching_assignment"
        save_as: "wizard"
        values:
          assignment_ids:
            - - 6
              - 0
              - - "REC: header_1.id"
                - "REC: header_2.id"
                - "REC: header_3.id"

      - step: "Run the generate wizard"
        action: "call"
        target: "wizard"
        method: "action_generate"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "Score sheets created: 2"

      - step: "The result note names the line that already has a sheet"
        action: "assert"
        target: "wizard"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "a score sheet already exists"

      - step: "The result note names the teacher without a user"
        action: "assert"
        target: "wizard"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "the teacher has no user"

      - step: "Find the sheet made for teacher 1"
        action: "search"
        model: "school_score_sheet"
        domain:
          - ["teaching_assignment_line_id", "=", "REC: line_1.id"]
        save_as: "sheet_1"
        expect_count: 1

      - step: "The sheet of teacher 1 is a draft owned by the teacher user"
        action: "assert"
        target: "sheet_1"
        asserts:
          state:
            type: "value"
            expected: "draft"
          user_id:
            type: "m2o"
            expected: "REC: user_1"
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_1"
          grade_class_id:
            type: "m2o"
            expected: "REC: class_x"
          subject_id:
            type: "m2o"
            expected: "REC: subject_a"
          academic_term_id:
            type: "m2o"
            expected: "REC: term_1"

      - step: "Find the sheet made for teacher 2"
        action: "search"
        model: "school_score_sheet"
        domain:
          - ["teaching_assignment_line_id", "=", "REC: line_3.id"]
        save_as: "sheet_3"
        expect_count: 1

      - step: "The sheet of teacher 2 is owned by the user of teacher 2"
        action: "assert"
        target: "sheet_3"
        asserts:
          user_id:
            type: "m2o"
            expected: "REC: user_2"

      - step: "No sheet is made for the line that already had one"
        action: "search"
