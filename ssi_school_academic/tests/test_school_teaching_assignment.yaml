  - name: "Teaching Assignment - Copy the assignments to another term"
    steps:
      - step: "Create the assignment of teacher 1 in term 1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTA header 1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the assignment of teacher 2 in term 1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_2"
        values:
          name: "SSTA header 2"
          code: "/"
          teacher_id: "REC: teacher_2.id"
          academic_term_id: "REC: term_1.id"

      - step: "Teacher 1 teaches class X, which has a homeroom in term 2"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 4

      - step: "Teacher 1 teaches class Y, which has no homeroom in term 2"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_2"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_y1.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2

      - step: "Teacher 2 assists in class X"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_3"
        values:
          assignment_id: "REC: header_2.id"
          homeroom_id: "REC: homeroom_x1.id"
          subject_id: "REC: subject_b.id"
          role: "assistant"
          weekly_hours: 1

      - step: "Teacher 2 already has an assignment in term 2"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_2_target"
        values:
          name: "SSTA header 2 term 2"
          code: "/"
          teacher_id: "REC: teacher_2.id"
          academic_term_id: "REC: term_2.id"

      - step: "Open the copy wizard"
        action: "create"
        model: "copy_teaching_assignment_from_previous_term"
        save_as: "wizard"
        values:
          source_term_id: "REC: term_1.id"
          target_term_id: "REC: term_2.id"
          assignment_ids:
            - - 6
              - 0
              - - "REC: header_1.id"
                - "REC: header_2.id"

      - step: "Run the copy wizard"
        action: "call"
        target: "wizard"
        method: "action_copy"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "Assignments copied: 1, lines copied: 1"

      - step: "The result note names the class without a homeroom"
        action: "assert"
        target: "wizard"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "the target term has 0 matching homerooms"

      - step: "The result note names the teacher who already has an assignment"
        action: "assert"
        target: "wizard"
        asserts:
          result_note:
            type: "value"
            operator: "contains"
            expected: "the teacher already has an assignment"

      - step: "Find the assignment created for teacher 1 in term 2"
        action: "search"
        model: "school_teaching_assignment"
        domain:
          - ["teacher_id", "=", "REC: teacher_1.id"]
          - ["academic_term_id", "=", "REC: term_2.id"]
        save_as: "copied_header"
        expect_count: 1

      - step: "The copied assignment has one line, moved to the homeroom of term 2"
        action: "assert"
        target: "copied_header"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
          code:
            type: "value"
            expected: "/"

      - step: "Find the copied line"
        action: "search"
        model: "school_teaching_assignment_line"
        domain:
          - ["assignment_id", "=", "REC: copied_header.id"]
        save_as: "copied_line"
        expect_count: 1

      - step: "The copied line keeps the subject, the role and the hours"
        action: "assert"
        target: "copied_line"
        asserts:
          homeroom_id:
            type: "m2o"
            expected: "REC: homeroom_x2"
          subject_id:
            type: "m2o"
            expected: "REC: subject_a"
          role:
            type: "value"
            expected: "main"
          weekly_hours:
            type: "value"
            expected: 4

      - step: "The assignment that already existed in term 2 is untouched"
        action: "assert"
        target: "header_2_target"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

