options:
  auto_refresh: true

setup:
  steps:
    - step: "Create the grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "SSTS Grade Type"
        code: "EVAL: 'SSTSGT%d' % env['school_grade_type'].search_count([])"

    - step: "Create the school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "SSTS School"
        code: "EVAL: 'SSTSSC%d' % env['school'].search_count([])"
        grade_type_id: "REC: grade_type.id"

    - step: "Create the academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "academic_year"
      values:
        name: "SSTS Academic Year"
        code: "EVAL: 'SSTSAY%d' % env['school_academic_year'].search_count([])"
        date_start: 2026-07-01
        date_end: 2027-06-30

    - step: "Create the term"
      action: "create"
      model: "school_academic_term"
      save_as: "term_1"
      values:
        name: "SSTS Term 1"
        code: "EVAL: 'SSTSTM%d' % env['school_academic_term'].search_count([])"
        date_start: 2026-07-01
        date_end: 2026-12-31
        year_id: "REC: academic_year.id"

    - step: "Create the grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "SSTS Grade"
        code: "EVAL: 'SSTSGR%d' % env['school_grade'].search_count([])"
        type_id: "REC: grade_type.id"

    - step: "Create class X"
      action: "create"
      model: "school_grade_class"
      save_as: "class_x"
      values:
        name: "SSTS Class X"
        code: "EVAL: 'SSTSCX%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create class Y"
      action: "create"
      model: "school_grade_class"
      save_as: "class_y"
      values:
        name: "SSTS Class Y"
        code: "EVAL: 'SSTSCY%d' % env['school_grade_class'].search_count([])"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"

    - step: "Create subject A taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_a"
      values:
        name: "SSTS Subject A"
        code: "EVAL: 'SSTSSA%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create subject B taught in the grade"
      action: "create"
      model: "school_subject"
      save_as: "subject_b"
      values:
        name: "SSTS Subject B"
        code: "EVAL: 'SSTSSB%d' % env['school_subject'].search_count([])"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade.id"

    - step: "Create the homeroom of class X"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_x"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_x.id"

    - step: "Create the homeroom of class Y"
      action: "create"
      model: "school_homeroom"
      save_as: "homeroom_y"
      values:
        academic_year_id: "REC: academic_year.id"
        academic_term_id: "REC: term_1.id"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        grade_class_id: "REC: class_y.id"

    - step: "Create the home address of teacher 1"
      action: "create"
      model: "res.partner"
      save_as: "partner_1"
      values:
        name: "SSTS Teacher Home 1"

    - step: "Create the employee of teacher 1"
      action: "create"
      model: "hr.employee"
      save_as: "employee_1"
      values:
        name: "SSTS Teacher Employee 1"
        company_id: "base.main_company"
        address_home_id: "REC: partner_1.id"

    - step: "Create teacher 1"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_1"
      values:
        name: "SSTS Teacher 1"
        code: "EVAL: 'SSTSTC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_1.id"

    - step: "Create the home address of teacher 2"
      action: "create"
      model: "res.partner"
      save_as: "partner_2"
      values:
        name: "SSTS Teacher Home 2"

    - step: "Create the employee of teacher 2"
      action: "create"
      model: "hr.employee"
      save_as: "employee_2"
      values:
        name: "SSTS Teacher Employee 2"
        company_id: "base.main_company"
        address_home_id: "REC: partner_2.id"

    - step: "Create teacher 2"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_2"
      values:
        name: "SSTS Teacher 2"
        code: "EVAL: 'SSTSTC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_2.id"

    - step: "Create the home address of teacher 3"
      action: "create"
      model: "res.partner"
      save_as: "partner_3"
      values:
        name: "SSTS Teacher Home 3"

    - step: "Create the employee of teacher 3"
      action: "create"
      model: "hr.employee"
      save_as: "employee_3"
      values:
        name: "SSTS Teacher Employee 3"
        company_id: "base.main_company"
        address_home_id: "REC: partner_3.id"

    - step: "Create teacher 3"
      action: "create"
      model: "school_teacher"
      save_as: "teacher_3"
      values:
        name: "SSTS Teacher 3"
        code: "EVAL: 'SSTSTC%d' % env['school_teacher'].search_count([])"
        employee_id: "REC: employee_3.id"

scenarios:
  - name: "Teaching Assignment Sync - A new teacher takes the draft sheet"
    steps:
      - step: "Create the assignment header_1"
        action: "create"
        model: "school_teaching_assignment"
        save_as: "header_1"
        values:
          name: "SSTS header_1"
          code: "/"
          teacher_id: "REC: teacher_1.id"
          academic_term_id: "REC: term_1.id"

      - step: "Create the line line_1"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_1"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x.id"
          subject_id: "REC: subject_a.id"
          role: "main"
          weekly_hours: 2

      - step: "Create the line line_2"
        action: "create"
        model: "school_teaching_assignment_line"
        save_as: "line_2"
        values:
          assignment_id: "REC: header_1.id"
          homeroom_id: "REC: homeroom_x.id"
          subject_id: "REC: subject_b.id"
          role: "main"
          weekly_hours: 2

      - step: "Create the score sheet sheet_cancelled"
        action: "create"
        model: "school_score_sheet"
        save_as: "sheet_cancelled"
        values:
          academic_term_id: "REC: term_1.id"
          grade_class_id: "REC: class_x.id"
          subject_id: "REC: subject_a.id"
          teacher_id: "REC: teacher_1.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"
          teaching_assignment_line_id: "REC: line_1.id"

      - step: "Create the cancel reason 1"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        values:
          name: "SSTS Cancel Reason 1"
          code: "EVAL: 'SSTSCR%d' % env['base.cancel_reason'].search_count([])"

      - step: "Cancel the sheet sheet_cancelled via the wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "sheet_cancelled"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason.id"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Create the score sheet sheet_draft"
        action: "create"
        model: "school_score_sheet"
        save_as: "sheet_draft"
        values:
          academic_term_id: "REC: term_1.id"
          grade_class_id: "REC: class_x.id"
          subject_id: "REC: subject_a.id"
          teacher_id: "REC: teacher_1.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"
          teaching_assignment_line_id: "REC: line_1.id"

      - step: "Create the score sheet sheet_done"
        action: "create"
        model: "school_score_sheet"
        save_as: "sheet_done"
        values:
          academic_term_id: "REC: term_1.id"
          grade_class_id: "REC: class_x.id"
          subject_id: "REC: subject_b.id"
          teacher_id: "REC: teacher_1.id"
          date: 2026-08-10
          user_id: "REF: base.user_admin"
          teaching_assignment_line_id: "REC: line_2.id"

      - step: "Confirm the sheet sheet_done"
        action: "call"
        target: "sheet_done"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the sheet sheet_done, which finishes it"
        action: "call"
        target: "sheet_done"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Change the teacher of the document"
        action: "write"
        target: "header_1"
        values:
          teacher_id: "REC: teacher_3.id"

      - step: "The draft sheet is of the new teacher"
        action: "assert"
        target: "sheet_draft"
        asserts:
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_3"
          teaching_assignment_line_id:
            type: "m2o"
            expected: "REC: line_1"

      - step: "The done sheet is kept"
        action: "assert"
        target: "sheet_done"
        asserts:
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_1"

      - step: "The cancelled sheet is kept"
        action: "assert"
        target: "sheet_cancelled"
        asserts:
          teacher_id:
            type: "m2o"
            expected: "REC: teacher_1"

  - name: "Teaching Assignment Sync - A new main line takes a manual draft sheet"
